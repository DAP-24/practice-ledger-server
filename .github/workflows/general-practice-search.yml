name: General Practice search

# See audit-search.yml's comments for how the two trigger methods work —
# this file is the same pattern, just for the "General Practice" profile,
# and deliberately scheduled a few minutes after the Audit search rather
# than at the exact same time (both searches update a couple of shared
# files — geocode_cache.json and search_history.json — and staggering
# them avoids any chance of one run's save overwriting the other's).
"on":
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      radius_miles:
        description: "Radius in miles (leave as 30, or change for just this one run)"
        required: false
        default: "30"
        type: string

permissions:
  contents: write

jobs:
  run-general-practice-search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install the browser needed for JavaScript-rendered sites
        run: playwright install --with-deps chromium

      - name: Run the General Practice search
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RADIUS_OVERRIDE_MILES: ${{ github.event.inputs.radius_miles }}
        run: python scheduled_search.py "General Practice"

      - name: Save the results back to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "seen_jobs__general_practice.json" geocode_cache.json search_history.json summaries/ docs/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "General Practice search: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
